<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f5aa8">
<title>Ruta de Ética MEC · Ety</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--sf:#fff;--ink:#262b3d;--mut:#69708a;--ln:#dcdfe8;--p:#3f5aa8;--pd:#2e4482;--ok:#3f8f6b;--okd:#2f6e51;--no:#b9473f;--tn:#eaedf3;--gold:#f5b642;--pad:clamp(14px,4vw,20px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b27;--sf:#212636;--ink:#e8eaf2;--mut:#a0a6bd;--ln:#323850;--p:#8aa0dc;--pd:#6a80bd;--ok:#6cc3a0;--okd:#4c9d7c;--no:#e08a82;--tn:#2a3044}}
:root[data-theme="dark"]{--bg:#171b27;--sf:#212636;--ink:#e8eaf2;--mut:#a0a6bd;--ln:#323850;--p:#8aa0dc;--pd:#6a80bd;--ok:#6cc3a0;--okd:#4c9d7c;--no:#e08a82;--tn:#2a3044}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;background-image:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--p) 8%,transparent),transparent 40%),radial-gradient(circle at 90% 100%,color-mix(in srgb,#c4453a 6%,transparent),transparent 40%);background-attachment:fixed;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.stripe{height:8px;background:linear-gradient(90deg,#c4453a 33%,#fff 33% 66%,#2f4f9a 66%);position:relative;z-index:1}

/* MASCOTA */
.mascot{width:clamp(64px,20vw,96px);height:clamp(64px,20vw,96px);flex:none;filter:drop-shadow(0 4px 10px rgba(63,90,168,.35));animation:float 4s ease-in-out infinite}
.mini-mascot{width:48px;height:48px;flex:none;animation:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.mascot-svg .eyes-happy,.mascot-svg .mouth-frown,.mascot-svg .mouth-big,.mascot-svg .mouth-think,.mascot-svg .sparkles{display:none}
.mascot-svg[data-mood="happy"] .eyes-happy,.mascot-svg[data-mood="celebrate"] .eyes-happy{display:block}
.mascot-svg[data-mood="happy"] .eyes-normal,.mascot-svg[data-mood="celebrate"] .eyes-normal{display:none}
.mascot-svg[data-mood="happy"] .mouth-smile,.mascot-svg[data-mood="celebrate"] .mouth-smile{display:none}
.mascot-svg[data-mood="happy"] .mouth-big,.mascot-svg[data-mood="celebrate"] .mouth-big{display:block}
.mascot-svg[data-mood="sad"] .mouth-smile{display:none}
.mascot-svg[data-mood="sad"] .mouth-frown{display:block}
.mascot-svg[data-mood="think"] .mouth-smile{display:none}
.mascot-svg[data-mood="think"] .mouth-think{display:block}
.mascot-svg[data-mood="celebrate"] .sparkles{display:block;animation:pop2 .6s both}
.bubble{position:relative;background:var(--sf);border:2px solid var(--ln);border-radius:18px;padding:10px 14px;font-size:.92rem;font-weight:600;box-shadow:0 3px 0 var(--ln);flex:1;min-width:0;animation:up .4s both;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid var(--sf)}
.bubble::after{content:"";position:absolute;left:-12px;top:18px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:11px solid var(--ln);z-index:-1}

/* HEADER */
.top{padding:20px var(--pad) 6px}
.mascot-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:14px}
.top h1{font-size:clamp(1.4rem,5.5vw,1.75rem);margin:0;line-height:1.1}
.top p{margin:4px 0 0;color:var(--mut);font-size:.88rem}

/* DASHBOARD */
.dash{padding:0 var(--pad);display:flex;flex-direction:column;gap:10px}
.lvl{display:flex;align-items:center;gap:12px;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:11px 12px;box-shadow:0 3px 0 var(--ln)}
.lvl .badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--gold),#e09a1e);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;animation:pop .5s}
.lvl .info{flex:1;min-width:0}
.lvl .lvl-name{font-family:"Bricolage Grotesque";font-weight:800;font-size:1rem;line-height:1.1}
.lvl .xp-bar{height:11px;border-radius:6px;background:var(--tn);overflow:hidden;margin-top:6px;position:relative}
.lvl .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--gold));border-radius:6px;transition:width .6s;position:relative;overflow:hidden}
.lvl .xp-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 2s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lvl .xp-txt{font-size:.75rem;color:var(--mut);margin-top:4px}

/* CHIPS: grid de 4 para que nunca se rompa */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:9px 4px;font-weight:700;font-size:.78rem;box-shadow:0 3px 0 var(--ln);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .15s,box-shadow .15s;min-height:64px;justify-content:center}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ln)}
.chip .ico{font-size:1.25rem;line-height:1}
.chip .num{font-family:"Bricolage Grotesque";font-size:1rem;color:var(--p);line-height:1}
.chip .lbl{font-size:.66rem;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.chip.streak .ico{animation:flame 1.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}

/* RING CARD */
.ring-card{display:flex;align-items:center;gap:14px;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--ln)}
.ring-wrap{position:relative;width:64px;height:64px;flex:none}
.ring-wrap svg{transform:rotate(-90deg);width:100%;height:100%}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-size:1rem;color:var(--ink)}
.ring-txt{flex:1;min-width:0}
.ring-txt strong{font-family:"Bricolage Grotesque";font-size:.98rem;display:block;line-height:1.2}
.ring-txt small{color:var(--mut);font-size:.78rem}

/* PATH */
.path{display:flex;flex-direction:column;gap:12px;padding:16px var(--pad) 24px}
.node{display:flex;align-items:center;gap:12px;background:none;padding:0;text-align:left;width:100%}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.dot{flex:none;width:clamp(58px,17vw,76px);height:clamp(58px,17vw,76px);border-radius:50%;background:var(--c);border-bottom:6px solid rgba(0,0,0,.25);display:grid;place-items:center;font:800 clamp(1.5rem,5.5vw,1.9rem) "Bricolage Grotesque";color:#fff;position:relative;transition:transform .2s}
.dot.d::after{content:"✓";position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--ok);font:700 .85rem Figtree;display:grid;place-items:center;border:3px solid var(--bg);animation:pop2 .5s both}
.node strong{display:block;font-family:"Bricolage Grotesque";font-size:clamp(1rem,3.8vw,1.2rem);line-height:1.2}
.node small{color:var(--mut);font-size:.78rem;line-height:1.3;display:block}
.node:hover .dot{transform:translateY(-3px) scale(1.05)}
.node:active .dot{border-bottom-width:2px;transform:translateY(3px)}

/* RETO DÍA */
.daily{margin:0 var(--pad) 24px;background:linear-gradient(135deg,var(--p),#2e4482);color:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:up .6s both}
.daily h3{color:#fff;font-size:1rem;margin-bottom:6px}
.daily p{color:rgba(255,255,255,.9);font-size:.85rem;margin:0 0 10px;line-height:1.4}
.daily .btn{width:100%;background:#fff;color:var(--p);border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;font-size:.88rem;text-align:left;transition:transform .15s;min-height:48px}
.daily .btn:hover{transform:scale(1.01)}
.daily .btn:active{transform:scale(.98)}
.daily .btn:disabled{cursor:default}

/* LECCIONES */
.les{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.bar{display:flex;align-items:center;gap:12px;padding:14px var(--pad);position:sticky;top:0;background:var(--bg);z-index:10}
.x{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);font-size:1.1rem;transition:transform .2s;flex:none;display:grid;place-items:center}
.x:hover{transform:rotate(90deg)}
.pg{flex:1;height:12px;border-radius:6px;background:var(--ln);overflow:hidden}
.pg i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .4s cubic-bezier(.175,.885,.32,1.275)}
.body{flex:1;padding:6px var(--pad) 20px;overflow-wrap:break-word}
.body h2{font-size:clamp(1.35rem,5vw,1.7rem);margin-bottom:12px}
.body p{max-width:60ch}
.tag{display:inline-block;background:var(--tn);color:var(--mut);padding:3px 12px;border-radius:99px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.foot{position:sticky;bottom:0;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--ln);z-index:10}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;background:var(--c);color:#fff;border-bottom:5px solid rgba(0,0,0,.28);font-size:1rem;transition:transform .1s;min-height:52px;touch-action:manipulation}
.go:hover:not(:disabled){transform:translateY(-2px)}
.go:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.go:disabled{background:var(--ln);color:var(--mut);border-bottom-color:transparent;cursor:default}

/* OPCIONES */
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:var(--sf);border:2px solid var(--ln);border-bottom-width:5px;font-weight:600;font-size:.95rem;transition:transform .1s,border-color .2s;min-height:56px;line-height:1.35;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--sf))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--sf))}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--tn);animation:up .3s both;font-size:.92rem;line-height:1.45}
.fb b{display:block;margin-bottom:2px}
.pill{display:inline-block;margin:4px 4px 0 0;padding:10px 14px;border-radius:99px;border:2px solid var(--ln);background:var(--sf);font-weight:600;font-size:.88rem;transition:transform .15s;min-height:44px;touch-action:manipulation}
.pill:hover{transform:translateY(-2px)}
.pill:active{transform:translateY(1px)}
.pill[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.box{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:14px 16px;margin:12px 0;animation:up .3s both;font-size:.92rem;line-height:1.45}
.ety-tip{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 12%,var(--sf)),color-mix(in srgb,var(--gold) 10%,var(--sf)));border:2px dashed var(--p);border-radius:16px;padding:12px 14px;margin:16px 0;animation:up .4s both}
.ety-tip .mini-mascot{width:42px;height:42px;flex:none;animation:none}
.ety-tip .txt{font-size:.88rem;line-height:1.4;flex:1;min-width:0}
.ety-tip .txt b{display:block;font-family:"Bricolage Grotesque";color:var(--p);margin-bottom:2px;font-size:.88rem}

/* WIDGETS */
.row{display:grid;grid-template-columns:clamp(64px,20vw,84px) 1fr clamp(36px,10vw,46px);gap:8px;align-items:center;margin-top:12px}
.row .t{height:18px;background:var(--tn);border-radius:6px;position:relative;overflow:hidden}
.row .t i{display:block;height:100%;transition:width .2s}
.row .t::after{content:"";position:absolute;left:70%;top:0;bottom:0;border-left:3px dashed var(--ink)}
.row input{grid-column:1/-1;width:100%;accent-color:var(--c);height:32px}
.row label,.row b{font-size:.82rem}
.body ul,.body ol{padding-left:1.3em}.body li{margin:6px 0;font-size:.95rem}
.cap{font-size:.82rem;color:var(--mut)}
.num{width:88px;font:inherit;padding:11px;border-radius:10px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);font-size:16px;touch-action:manipulation;min-height:44px}
.low{color:var(--no);font-weight:700}
.end{text-align:center;padding-top:16px}
.end .big{font:800 clamp(3rem,12vw,4rem) "Bricolage Grotesque";color:var(--c);line-height:1;margin:8px 0}

/* ANIMACIONES */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes pop2{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes mar{to{stroke-dashoffset:-56}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.les{animation:sl .35s both}.node,.body>*,.stp,.body li,.pill{animation:up .45s both}
.opt.no{animation:sk .35s}.opt.ok{animation:pop .3s}.end .big{animation:pop2 .6s both}
.mar{animation:mar 3s linear infinite}.cn{cursor:pointer}.cn circle{transition:opacity .2s}
.stp{counter-increment:n;position:relative;margin:4px 0 0 12px;padding:0 0 18px 32px;border-left:3px solid var(--ln)}
.stp:last-child{border-left-color:transparent}
.stp::before{content:counter(n);position:absolute;left:-16px;top:0;width:29px;height:29px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.stp b{display:block;line-height:1.3;padding-top:4px;font-size:.95rem}
.stp span{color:var(--mut);font-size:.88rem;line-height:1.4;display:block;margin-top:2px}

/* CONFETI */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:up .3s both;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{background:var(--sf);border-radius:20px;padding:20px;max-width:480px;width:100%;max-height:85vh;max-height:85dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative}
.modal h2{color:var(--p);margin-bottom:16px;font-size:1.3rem;padding-right:40px}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--tn);margin-bottom:8px;transition:transform .2s}
.ach:hover{transform:translateX(4px)}
.ach .ico{font-size:1.6rem;flex:none;filter:grayscale(1);opacity:.4}
.ach.unlocked .ico{filter:none;opacity:1;animation:pop .5s}
.ach.unlocked{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--sf)),var(--sf))}
.ach b{display:block;font-family:"Bricolage Grotesque";font-size:.92rem}
.ach small{color:var(--mut);font-size:.78rem}
.close-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:var(--tn);border:none;font-size:1.3rem;cursor:pointer;color:var(--ink);display:grid;place-items:center;touch-action:manipulation}

/* ===== PANTALLAS MUY PEQUEÑAS (<380px) ===== */
@media(max-width:380px){
  .chip{min-height:58px;padding:7px 2px}
  .chip .ico{font-size:1.1rem}
  .chip .num{font-size:.92rem}
  .chip .lbl{font-size:.6rem}
  .bubble{font-size:.86rem;padding:9px 12px}
  .opt{font-size:.9rem;padding:13px 14px}
  .pill{padding:9px 12px;font-size:.84rem}
  .go{padding:14px;font-size:.95rem}
  .node strong{font-size:.96rem}
  .node small{font-size:.72rem}
  .dot{width:56px;height:56px}
  .daily{padding:14px}
  .daily .btn{font-size:.84rem;padding:11px 12px}
}

/* ===== DESKTOP: un poco más aire ===== */
@media(min-width:600px){
  .node{width:88%}
  .node:nth-child(even){align-self:flex-end}
  .path{padding-bottom:32px}
}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stripe"></div>
<div class="app" id="app"></div>
<div id="confetti"></div>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

/* ESTADO */
let state={done:{},xp:0,streak:{count:0,lastDate:null},ach:{},sound:true,dailyDone:null};
try{
  const s=localStorage.getItem('mecGE3');
  if(s)state={...state,...JSON.parse(s)};
  else{const o=localStorage.getItem('mecGE2');if(o){const p=JSON.parse(o);state={...state,...p};}}
}catch(e){}
const save=()=>{try{localStorage.setItem('mecGE3',JSON.stringify(state))}catch(e){}};

/* NIVELES */
const LEVELS=[{xp:0,name:'Aprendiz',icon:'🌱'},{xp:100,name:'Curioso',icon:'🔍'},{xp:250,name:'Explorador',icon:'🧭'},{xp:500,name:'Guardián',icon:'🛡️'},{xp:1000,name:'Maestro',icon:'📚'},{xp:2000,name:'Sabio',icon:'👑'}];
function getLevel(xp){let l=LEVELS[0];for(const lv of LEVELS)if(xp>=lv.xp)l=lv;return l;}
function nextLevel(xp){return LEVELS.find(lv=>lv.xp>xp);}

/* LOGROS */
const ACH=[
  {id:'first',icon:'🎓',name:'Primer paso',desc:'Completa tu primera lección',check:s=>Object.keys(s.done).filter(k=>k!=='f').length>=1},
  {id:'three',icon:'🏆',name:'Estudioso',desc:'Completa 3 lecciones',check:s=>Object.keys(s.done).filter(k=>k!=='f').length>=3},
  {id:'all',icon:'🌟',name:'Casi experto',desc:'Completa todas las lecciones',check:s=>Object.keys(s.done).filter(k=>k!=='f').length>=LES.length},
  {id:'perfect',icon:'💯',name:'Perfeccionista',desc:'100% en una lección',check:s=>Object.values(s.done).some(d=>d.t&&d.c===d.t)},
  {id:'final',icon:'🎯',name:'Preciso',desc:'8+/10 en la evaluación final',check:s=>s.done.f&&s.done.f.c>=8},
  {id:'xp500',icon:'⚡',name:'Energía',desc:'Alcanza 500 XP',check:s=>s.xp>=500},
  {id:'streak3',icon:'🔥',name:'Constante',desc:'Vuelve 3 días seguidos',check:s=>s.streak.count>=3},
  {id:'master',icon:'👑',name:'Guardián de la ética',desc:'Todo completo al 100%',check:s=>Object.keys(s.done).filter(k=>k!=='f').length>=LES.length&&s.done.f&&s.done.f.c>=9}
];
function checkAch(){
  const n=[];
  for(const a of ACH){if(!state.ach[a.id]&&a.check(state)){state.ach[a.id]=true;n.push(a);}}
  if(n.length){save();n.forEach(a=>toast(`🏅 ¡Logro! ${a.name}`));}
  return n;
}

/* SONIDO */
let audioCtx=null;
function beep(type){
  if(!state.sound)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    if(type==='correct'){[523.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.001,t+i*0.08);g.gain.exponentialRampToValueAtTime(0.12,t+i*0.08+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.25);o.start(t+i*0.08);o.stop(t+i*0.08+0.3);});}

/* CONFETI */
function confetti(){
  const colors=['#c4453a','#2f4f9a','#4a8a6e','#a8762d','#7a62a8','#3b8a96','#f5b642'];
  const c=$('#confetti');
  for(let i=0;i<60;i++){
    const p=E('div');
    const size=6+Math.random()*9;
    p.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-20px;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'3px'};transform:rotate(${Math.random()*360}deg);animation:fall ${1.5+Math.random()*1.8}s ease-in forwards;animation-delay:${Math.random()*.5}s`;
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML='',4000);
}

/* TOAST */
function toast(msg){
  const t=E('div',null,msg);
  t.style.cssText='position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .3s both;font-size:.92rem;max-width:90vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400)},2500);
}

const app=$("#app");

/* HOME */

  app.innerHTML=`
    <div class="top">
      <div class="mascot-row">${mascotSVG('happy')}<div class="bubble">${msg}</div></div>
      <h1>Ruta de ética del MEC</h1>

    </div>
    <div class="dash">

        <div class="badge">${lvl.icon}</div>
        <div class="info">
          <div class="lvl-name">${lvl.name}</div>
          <div class="xp-bar"><i style="width:${Math.min(100,pct)}%"></i></div>
          <div class="xp-txt">${state.xp} XP${nxt?` · faltan ${nxt.xp-state.xp} para ${nxt.name}`:' · ¡nivel máximo!'}</div>
        </div>
      </div>
      <div class="chips">
        <div class="chip streak"><span class="ico">🔥</span><span class="num">${state.streak.count}</span><span class="lbl">Racha</span></div>

        <button class="chip" onclick="toggleSound()"><span class="ico">${state.sound?'🔊':'🔇'}</span><span class="num" style="font-size:.82rem">Sonido</span><span class="lbl">${state.sound?'On':'Off'}</span></button>
        <button class="chip" onclick="toggleTheme()"><span class="ico">${document.documentElement.getAttribute('data-theme')==='dark'?'🌙':'☀️'}</span><span class="num" style="font-size:.82rem">Tema</span><span class="lbl">Cambiar</span></button>
      </div>
      <div class="ring-card">
        <div class="ring-wrap">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--ln)" stroke-width="8"/><circle cx="32" cy="32" r="28" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*n/L} ${C}"/></svg>
          <b>${n}/${L}</b>
        </div>
        <div class="ring-txt">
          <strong>Progreso de la ruta</strong>
          <small>${n===L?'¡Ruta completa! Ahora la evaluación final.':'Sigue avanzando, ¡vas bien!'}</small>
        </div>
      </div>

  LES.forEach((l,i)=>{
    const b=E("button","node",`<span class="dot${state.done[i]?" d":""}" style="--c:${l.c}">${i+1}</span><span><strong>${l.n}</strong><small>${state.done[i]?`Completa · ${state.done[i].c}/${state.done[i].t} aciertos`:l.s}</small></span>`);

  });
  const f=E("button","node",`<span class="dot${state.done.f?" d":""}" style="--c:#4a5568">★</span><span><strong>Evaluación final</strong><small>${state.done.f?`Completa · ${state.done.f.c}/${state.done.f.t} aciertos`:"10 preguntas de todo el curso"}</small></span>`);
  f.onclick=()=>run("f");
  $("#pt").append(f);
  $("#pt").querySelectorAll(".node").forEach((e,j)=>e.style.animationDelay=j*.06+"s");
  renderDaily();

/* RETO */
function renderDaily(){
  const allQ=LES.flatMap(l=>l.it.filter(x=>x.k==="q"));
  const seed=new Date().toDateString();
  let h=0;for(let i=0;i<seed.length;i++)h=((h<<5)-h+seed.charCodeAt(i))|0;
  const q=allQ[Math.abs(h)%allQ.length];
  const card=$("#dailyCard");
  if(!card)return;
  const answered=state.dailyDone===seed;
  card.innerHTML=`
    <h3>🎯 Reto del día</h3>
    <p>${answered?"¡Ya lo respondiste! Vuelve mañana por otro.":q.q}</p>
    ${answered?"":q.o.map((o,i)=>`<button class="btn" style="margin-bottom:6px" onclick="answerDaily(${i},${q.a},this)">${o}</button>`).join("")}
  `;
}
function answerDaily(i,correct,btn){
  const card=$("#dailyCard");
  const btns=card.querySelectorAll(".btn");
  btns.forEach(b=>b.disabled=true);
  if(i===correct){btn.style.background="#38a169";btn.style.color="#fff";addXP(15);beep("correct");toast("🎯 ¡Correcto! +15 XP");}
  else{btn.style.background="#dc3545";btn.style.color="#fff";btns[correct].style.background="#38a169";btns[correct].style.color="#fff";beep("wrong");}
  state.dailyDone=new Date().toDateString();save();
  setTimeout(renderDaily,1500);
}

/* LOGROS */
function showAch(){
  const modal=E("div","modal-bg");
  modal.innerHTML=`<div class="modal"><button class="close-x" onclick="this.closest('.modal-bg').remove()" aria-label="Cerrar">✕</button><h2>🏅 Tus logros</h2>${ACH.map(a=>`<div class="ach ${state.ach[a.id]?'unlocked':''}"><span class="ico">${a.icon}</span><div><b>${a.name}</b><small>${a.desc}</small></div></div>`).join("")}</div>`;
  document.body.appendChild(modal);
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}

/* TOGGLES */
function toggleSound(){state.sound=!state.sound;save();home();if(state.sound)beep("xp");}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("mecTheme",next)}catch(e){}
  home();
}

/* XP */
function addXP(n){
  const before=getLevel(state.xp).name;
  state.xp+=n;save();
  const after=getLevel(state.xp).name;
  if(before!==after){toast(`🎉 ¡Subiste a ${after}!`);beep("complete");confetti();}
}

/* MOTOR */
function build(l){
  const o=[];
  l.it.forEach(x=>{
    if(x.k=="v")sh(VALS).slice(0,5).forEach(v=>{
      const w=sh(VALS.filter(y=>y!=v)).slice(0,2).map(y=>y[0]);
      const op=sh([v[0],...w]);
      o.push(Q("“"+v[1]+"”",op,op.indexOf(v[0]),"Es el valor "+v[0]+"."));
    });
    else o.push(x);
  });
  return o;
}
const finalL=()=>({n:"Evaluación final",c:"#4a5568",it:[X("Evaluación final","Diez preguntas al azar de las siete lecciones. Es el momento de comprobar todo lo aprendido."),...sh(LES.flatMap(l=>l.it.filter(x=>x.k=="q"))).slice(0,10)]});

    else if(x.k=="d"){
      b.innerHTML=`<span class="tag">Aprende · calculadora</span><h2>Indicador de cumplimiento</h2><p>Un taller de ética se planeó 4 veces. Cambia los números y mira el IDC.</p><label>Ejecutadas <input class="num" type="number" id="a" min="0" value="3" inputmode="numeric"></label> <label>Planteadas <input class="num" type="number" id="p" min="1" value="4" inputmode="numeric"></label><div class="box" style="text-align:center"><svg width="140" height="140" viewBox="0 0 150 150" role="img" aria-label="Indicador de cumplimiento"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--ln)" stroke-width="16"/><circle id="ib" cx="75" cy="75" r="60" fill="none" stroke="var(--c)" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 377" transform="rotate(-90 75 75)" style="transition:stroke-dasharray .5s"/><text x="75" y="83" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" id="ip"></text></svg><h3 id="it"></h3></div>`;
      const u=()=>{const r=Math.min(1,+$("#a").value/Math.max(1,+$("#p").value));$("#ib").setAttribute("stroke-dasharray",`${r*377} 377`);$("#ip").textContent=Math.round(r*100)+"%";$("#it").textContent=`IDC = ${r.toFixed(2)} (${Math.round(r*100)} %)`};
      $("#a").oninput=$("#p").oninput=u;u();
    }
    [...b.children].forEach((e,j)=>e.style.animationDelay=j*.06+"s");
    b.querySelectorAll(".stp,li,.pill").forEach((e,j)=>e.style.animationDelay=.12+j*.07+"s");
    window.scrollTo(0,0);
  }
  function fin(){
    state.done[li]={c,t};
    addXP(li==="f"?200:50);
    save();checkAch();
    if(t>0||li==="f"){confetti();beep("complete");}
    const perfect=t&&c===t;
    const msg=li==="f"?(c>=8?"¡Excelente! Estás listo para liderar la gestión ética.":c>=5?"Buen intento. Repasa los temas y vuelve a probar.":"No te desanimes: vuelve a las lecciones y regresa."):(perfect?"¡Perfecto! Dominaste esta lección.":c>=t*.7?"¡Muy bien! Ya casi la dominas.":"Buen intento. Repásala cuando quieras.");
    app.innerHTML=`<div class="les" style="--c:${l.c}"><div class="body end">${mascotSVG('celebrate','mascot')}<span class="tag">Lección completa</span><div class="big">${t?c+"/"+t:"✓"}</div><h2>${l.n}</h2><p style="margin:0 auto">${msg}</p><div style="margin-top:16px;display:inline-flex;gap:8px;align-items:center;background:var(--tn);padding:8px 16px;border-radius:99px;font-weight:700"><span>⚡</span><span>+${li==="f"?200:50} XP</span></div></div><div class="foot"><button class="go" id="g">Volver a la ruta</button></div></div>`;
    $("#g").onclick=home;
  }
  step();
}

/* INIT */
(function(){
  const savedTheme=localStorage.getItem("mecTheme");
  if(savedTheme)document.documentElement.setAttribute("data-theme",savedTheme);
  const today=new Date().toDateString();
  if(state.streak.lastDate!==today){
    const yest=new Date(Date.now()-86400000).toDateString();
    state.streak.count=state.streak.lastDate===yest?state.streak.count+1:1;
    state.streak.lastDate=today;save();
    if(state.streak.count>1)setTimeout(()=>toast(`🔥 ¡Racha de ${state.streak.count} días!`),800);
  }
  checkAch();
  home();
})();
</script>
</body>
