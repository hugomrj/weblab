<head>

<title>Ruta de Ética MEC</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--sf:#fff;--ink:#262b3d;--mut:#69708a;--ln:#dcdfe8;--p:#3f5aa8;--pd:#2e4482;--ok:#3f8f6b;--okd:#2f6e51;--no:#b9473f;--tn:#eaedf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b27;--sf:#212636;--ink:#e8eaf2;--mut:#a0a6bd;--ln:#323850;--p:#8aa0dc;--pd:#6a80bd;--ok:#6cc3a0;--okd:#4c9d7c;--no:#e08a82;--tn:#2a3044}}
:root[data-theme="dark"]{--bg:#171b27;--sf:#212636;--ink:#e8eaf2;--mut:#a0a6bd;--ln:#323850;--p:#8aa0dc;--pd:#6a80bd;--ok:#6cc3a0;--okd:#4c9d7c;--no:#e08a82;--tn:#2a3044}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0 0 .4em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.stripe{height:8px;background:linear-gradient(90deg,#c4453a 33%,#fff 33% 66%,#2f4f9a 66%)}
.top{display:flex;align-items:center;gap:16px;padding:22px 20px 10px}
.top h1{font-size:1.9rem;margin:0}.top p{margin:2px 0 0;color:var(--mut);font-size:.95rem}
.ring{flex:none;position:relative;width:76px;height:76px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-size:1.1rem}
.path{display:flex;flex-direction:column;gap:14px;padding:18px 20px 40px}
.node{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left;width:86%}
.node:nth-child(even){align-self:flex-end;flex-direction:row-reverse;text-align:right}
.dot{flex:none;width:76px;height:76px;border-radius:50%;background:var(--c);border-bottom:6px solid rgba(0,0,0,.25);display:grid;place-items:center;font:800 1.9rem "Bricolage Grotesque";color:#fff;position:relative}
.dot.d::after{content:"✓";position:absolute;right:-4px;top:-4px;width:28px;height:28px;border-radius:50%;background:var(--ok);font:700 .95rem Figtree;display:grid;place-items:center;border:3px solid var(--bg)}
.node strong{display:block;font-family:"Bricolage Grotesque";font-size:1.2rem;line-height:1.2}.node small{color:var(--mut)}
.node:hover .dot{transform:translateY(-2px)}.node:active .dot{border-bottom-width:2px;transform:translateY(3px)}
.les{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.bar{display:flex;align-items:center;gap:12px;padding:16px 20px}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);font-size:1.1rem}
.pg{flex:1;height:14px;border-radius:7px;background:var(--ln);overflow:hidden}.pg i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .3s}
.body{flex:1;padding:8px 20px 24px}
.body h2{font-size:1.7rem}.body p{max-width:60ch}
.tag{display:inline-block;background:var(--tn);color:var(--mut);padding:2px 12px;border-radius:99px;font-size:.85rem;font-weight:600;margin-bottom:10px}
.foot{position:sticky;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--ln)}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-weight:700;background:var(--c);color:#fff;border-bottom:5px solid rgba(0,0,0,.28);font-size:1.05rem}
.go:disabled{background:var(--ln);color:var(--mut);border-bottom-color:transparent;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:var(--sf);border:2px solid var(--ln);border-bottom-width:5px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--sf))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--sf))}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--tn)}.fb b{display:block}
.pill{display:inline-block;margin:4px 4px 0 0;padding:8px 14px;border-radius:99px;border:2px solid var(--ln);background:var(--sf);font-weight:600}
.pill[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.box{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:grid;grid-template-columns:84px 1fr 46px;gap:10px;align-items:center;margin-top:12px}
.row .t{height:20px;background:var(--tn);border-radius:6px;position:relative;overflow:hidden}.row .t i{display:block;height:100%;transition:width .2s}
.row .t::after{content:"";position:absolute;left:70%;top:0;bottom:0;border-left:3px dashed var(--ink)}
.row input{grid-column:1/-1;width:100%;accent-color:var(--c)}
.body ul,.body ol{padding-left:1.2em}.body li{margin:6px 0}.cap{font-size:.85rem;color:var(--mut)}
.num{width:92px;font:inherit;padding:9px;border-radius:10px;border:2px solid var(--ln);background:var(--sf);color:var(--ink)}
.low{color:var(--no);font-weight:700}
.end{text-align:center;padding-top:36px}.end .big{font:800 4rem "Bricolage Grotesque";color:var(--c)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes pop2{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes mar{to{stroke-dashoffset:-56}}
.les{animation:sl .35s both}.node,.body>*,.stp,.body li,.pill,.gc{animation:up .45s both}
.opt.no{animation:sk .35s}.opt.ok{animation:pop .3s}.end .big{animation:pop2 .6s both}
.mar{animation:mar 3s linear infinite}.cn{cursor:pointer}.cn circle{transition:opacity .2s}
.stp{counter-increment:n;position:relative;margin:4px 0 0 14px;padding:0 0 20px 34px;border-left:3px solid var(--ln)}
.stp:last-child{border-left-color:transparent}
.stp::before{content:counter(n);position:absolute;left:-17px;top:0;width:31px;height:31px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.stp b{display:block;line-height:1.3;padding-top:4px}.stp span{color:var(--mut);font-size:.95rem}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.gc{background:var(--sf);border:2px solid var(--ln);border-bottom-width:5px;border-radius:14px;padding:12px 8px;text-align:center;font-weight:600;font-size:.92rem;line-height:1.25}
.gc i{display:block;font-style:normal;font-size:1.8rem;margin-bottom:4px}.gc[aria-pressed=true]{border-color:var(--c);background:var(--tn)}
.cert{background:var(--sf);border:3px solid var(--c);border-radius:16px;padding:30px 18px 22px;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,#c4453a 33%,#fff 33% 66%,#2f4f9a 66%)}
.cert h3{font-size:1.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

{k:"ck",t:"Medidas mínimas contra la corrupción",p:"El Art. 15 exige a los directivos adoptar como mínimo estas siete medidas. Toca cada una para marcarla como aplicada.",d:"¡Las siete medidas del Art. 15!",n:["Guiar sus actuaciones por el Código de Ética","Dar publicidad a las normas éticas","Garantizar procedimientos claros, equitativos, viables y transparentes","Denunciar conductas irregulares de los servidores","Capacitar a los servidores en ética pública y responsabilidad social","Rendir cuentas y publicar la información no confidencial","Contratar según la ley y evaluar los contratos"]},

function build(l){const o=[];l.it.forEach(x=>{if(x.k=="v")sh(VALS).slice(0,5).forEach(v=>{const w=sh(VALS.filter(y=>y!=v)).slice(0,2).map(y=>y[0]),op=sh([v[0],...w]);o.push(Q("“"+v[1]+"”",op,op.indexOf(v[0]),"Es el valor "+v[0]+"."))});else o.push(x)});return o}
