 ['rol','rol_permiso','1 : N'],['permiso','rol_permiso','1 : N'],['usuario','audit_log','1 : N'],['cliente','cliente_direccion','1 : N'],
 ['empresa','ejercicio_contable','1 : N'],['ejercicio_contable','asiento','1 : N'],['usuario','asiento','1 : N'],['asiento','asiento_detalle','1 : N'],
 ['plan_cuenta','asiento_detalle','1 : N'],['plan_cuenta','configuracion_contable','1 : N'],
 // comisiones
 ['comision_regla','comision','1 : N'],['usuario','comision','1 : N'],['factura','comision','1 : N'],['cobro','comision','1 : 0..N',1],['categoria','comision_regla','1 : 0..N',1],
 // conciliación
 ['cuenta_bancaria','extracto_bancario','1 : N'],['extracto_bancario','extracto_linea','1 : N'],['extracto_linea','conciliacion','1 : 0..1'],
 ['cobro_detalle','conciliacion','1 : 0..1',1],['pago_proveedor','conciliacion','1 : 0..1',1],['usuario','conciliacion','1 : N'],
 // sifen
 ['sifen_lote','sifen_evento','1 : N'],['sifen_lote','factura','1 : N',1],['factura','sifen_evento','1 : 0..N',1],['nota_credito','sifen_evento','1 : 0..N',1],
 // precios
 ['lista_precio','lista_precio_detalle','1 : N'],['producto','lista_precio_detalle','1 : N'],['lista_precio','cliente','1 : 0..N',1],['moneda','lista_precio','1 : N'],
 ['producto','promocion','1 : 0..N',1],['categoria','promocion','1 : 0..N',1],
 // lotes
 ['producto','lote','1 : N'],['proveedor','lote','1 : 0..N',1],['lote','stock_lote','1 : N'],['deposito','stock_lote','1 : N'],['lote','serie_producto','1 : 0..N',1],
 ['producto','serie_producto','1 : N'],['factura_detalle','serie_producto','1 : 0..N',1],['lote','movimiento_stock','1 : 0..N',1],
 // activos
 ['sucursal','activo_fijo','1 : N'],['factura_compra','activo_fijo','1 : 0..N',1],['plan_cuenta','activo_fijo','1 : N'],['activo_fijo','depreciacion','1 : N'],
 ['asiento','depreciacion','1 : 0..1',1],['activo_fijo','activo_baja','1 : 0..1'],
 // rrhh
 ['empresa','departamento','1 : N'],['departamento','empleado','1 : N'],['cargo','empleado','1 : N'],['sucursal','empleado','1 : N'],['usuario','empleado','0..1 : 0..1',1],
 ['empleado','contrato','1 : N'],['empleado','asistencia','1 : N'],['empleado','licencia','1 : N'],['empresa','nomina','1 : N'],['asiento','nomina','1 : 0..1',1],
 ['nomina','nomina_detalle','1 : N'],['empleado','nomina_detalle','1 : N'],['concepto_nomina','nomina_detalle','1 : N'],
 // huecos cubiertos
 ['factura_compra','nota_credito_compra','1 : N'],['proveedor','anticipo_proveedor','1 : N'],['pago_proveedor','anticipo_proveedor','1 : 0..1',1],
 ['cuenta_bancaria','cheque_emitido','1 : N'],['pago_proveedor','cheque_emitido','1 : 0..1',1],
 ['deposito','transferencia_deposito','origen y destino 1 : N'],['transferencia_deposito','transferencia_detalle','1 : N'],['transferencia_detalle','movimiento_stock','1 : 0..2',1],
 ['empresa','parametro_sistema','1 : N'],['empresa','secuencia_documento','1 : N'],['sucursal','secuencia_documento','1 : 0..N',1],
 ['retencion_tipo','retencion','1 : N'],['cobro','retencion','1 : 0..N',1],['pago_proveedor','retencion','1 : 0..N',1],['factura','retencion','1 : 0..N',1],['factura_compra','retencion','1 : 0..N',1]
];

// Parseo y layout automático por columnas de módulo
const tables = T.map(([id, module, role, f, badge]) => ({
  id, module, role, badge,
  fields: f.map(s => { const [name, type, fl = ''] = s.split('|'); return {name, type, key: fl.includes('P') ? 'PK' : fl.includes('F') ? 'FK' : '', nullable: s.split('|').slice(2).join('').includes('N')}; })
}));
const cursor = {};
tables.forEach(t => {
  const k = COLX[t.module]; cursor[k] = cursor[k] ?? 30;
  t.x = k; t.y = cursor[k]; cursor[k] += 40 + t.fields.length * 29 + 40;
});
const defaultPositions = Object.fromEntries(tables.map(t => [t.id, {x: t.x, y: t.y}]));
const byId = Object.fromEntries(tables.map(t => [t.id, t]));

const $ = id => document.getElementById(id);
const tablesLayer = $('tables-layer'), edgesLayer = $('edges-layer'), world = $('canvas-world'), viewport = $('viewport'), sidebar = $('info-sidebar');
let scale = 0.35, panX = 20, panY = 10, activeId = null, hoverId = null;
let drag = null; // {type:'card'|'pan', ...}

$('legend').innerHTML = Object.entries(MOD).map(([k, m]) => `<span onclick="toggleMod('${k}')" class="flex items-center gap-1.5 cursor-pointer hover:opacity-80"><span class="w-3 h-3 rounded-sm ${m.c}"></span><span class="text-slate-300 font-medium">${m.l}</span></span>`).join('');
world.style.height = Math.max(...Object.values(cursor)) + 60 + 'px';

function renderTables() {
  tablesLayer.innerHTML = '';
  tables.forEach(t => {
    const m = MOD[t.module], card = document.createElement('div');
    card.id = 'table-' + t.id;
    card.className = `table-card absolute rounded-xl border ${m.b} w-72 overflow-hidden cursor-move`;
    card.style.left = t.x + 'px'; card.style.top = t.y + 'px';
    const badge = t.badge ? `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${m.bd} tracking-wider">${t.badge}</span>` : '';
    card.innerHTML = `<div class="${m.h} px-3.5 py-2 flex items-center justify-between"><span class="font-bold text-white text-sm mono">${t.id}</span>${badge}</div><div class="divide-y divide-slate-700/50 py-1">` +
      t.fields.map(f => {
        const kb = f.key === 'PK' ? `<span class="text-[10px] font-bold text-amber-400 bg-amber-400/10 border border-amber-400/30 px-1 rounded mono w-6 text-center shrink-0">PK</span>`
          : f.key === 'FK' ? `<span class="text-[10px] font-bold text-cyan-400 bg-cyan-400/10 border border-cyan-400/30 px-1 rounded mono w-6 text-center shrink-0">FK</span>` : `<span class="w-6 shrink-0"></span>`;
        const nc = f.key === 'PK' ? 'text-amber-200 font-semibold' : f.key === 'FK' ? 'text-cyan-200' : 'text-slate-200';
        const nb = f.nullable ? `<span class="text-[9px] font-semibold text-rose-300 bg-rose-500/15 border border-rose-400/30 px-1 rounded mono ml-1">NULL</span>` : '';
        return `<div class="px-3 py-1.5 flex items-center justify-between text-xs"><div class="flex items-center gap-1.5 overflow-hidden">${kb}<span class="mono truncate ${nc}">${f.name}</span>${nb}</div><span class="mono text-[10px] text-slate-400 ml-2 shrink-0">${f.type}</span></div>`;
      }).join('') + `</div>`;
    card.addEventListener('pointerdown', e => {
      drag = {type: 'card', t, card, sx: e.clientX, sy: e.clientY, ox: t.x, oy: t.y, moved: false};
      e.stopPropagation();
    });
    card.addEventListener('mouseenter', () => { hoverId = t.id; refresh(); });
    card.addEventListener('mouseleave', () => { hoverId = null; refresh(); });
    tablesLayer.appendChild(card);
  });
}

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.type === 'card') {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return; // umbral: evita abrir sidebar al arrastrar
    drag.moved = true;
    drag.t.x = drag.ox + dx / scale; drag.t.y = drag.oy + dy / scale;
    drag.card.style.left = drag.t.x + 'px'; drag.card.style.top = drag.t.y + 'px';
    updateEdges();
  } else { panX = drag.px + e.clientX - drag.sx; panY = drag.py + e.clientY - drag.sy; updateTransform(); }
});
window.addEventListener('pointerup', () => {
  if (drag && drag.type === 'card' && !drag.moved) openSidebar(drag.t);
  drag = null; viewport.classList.remove('cursor-grabbing');
});
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.table-card')) return;
  drag = {type: 'pan', sx: e.clientX, sy: e.clientY, px: panX, py: panY};
  viewport.classList.add('cursor-grabbing');
});

function relsOf(id) { return R.filter(r => r[0] === id || r[1] === id); }
function related(id) { const s = new Set([id]); relsOf(id).forEach(r => { s.add(r[0]); s.add(r[1]); }); return s; }

let focusMod = null;
function toggleMod(k) { focusMod = focusMod === k ? null : k; refresh(); }
function refresh() { updateEdges(); const a = hoverId || activeId, rel = a ? related(a) : null;
  tables.forEach(t => { const el = $('table-' + t.id); el.classList.toggle('dimmed', (!!rel && !rel.has(t.id)) || (focusMod && t.module !== focusMod)); el.classList.toggle('hl', t.id === activeId); }); }

function openSidebar(t) {
  activeId = t.id; const m = MOD[t.module];
  $('sb-badge').textContent = m.l; $('sb-badge').className = `text-[10px] font-bold px-2 py-0.5 rounded tracking-wider uppercase mb-1 inline-block ${m.bd}`;
  $('sb-title').textContent = t.id; $('sb-role').textContent = t.role;
  $('sb-fields').innerHTML = t.fields.map(f => {
    const kb = f.key ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold mono ${f.key === 'PK' ? 'bg-amber-400/20 text-amber-300' : 'bg-cyan-400/20 text-cyan-300'}">${f.key}</span>` : '';
    const nb = f.nullable ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold mono bg-rose-500/15 text-rose-300">NULL</span>` : '';
    return `<div class="flex items-center justify-between p-2 rounded bg-slate-900/60 border border-slate-800 mono"><div class="flex items-center gap-2 flex-wrap"><span>${f.name}</span>${kb}${nb}</div><span class="text-slate-400 text-[11px]">${f.type}</span></div>`;
  }).join('');
  $('sb-rels').innerHTML = relsOf(t.id).map(r => {
    const other = r[0] === t.id ? r[1] : r[0];
    return `<div class="flex items-center justify-between p-2 rounded bg-slate-900/60 border border-slate-800 mono"><span>${r[0] === t.id ? '→' : '←'} ${other}</span><span class="text-sky-300">${r[2]}${r[3] ? ' (opc.)' : ''}</span></div>`;
  }).join('');
  sidebar.classList.remove('hidden'); refresh();
}
function closeSidebar() { sidebar.classList.add('hidden'); activeId = null; refresh(); }

function anchors(A, B) {
  const ca = {x: A.x + A.w / 2, y: A.y + A.h / 2}, cb = {x: B.x + B.w / 2, y: B.y + B.h / 2}, dx = cb.x - ca.x, dy = cb.y - ca.y;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? {p1: {x: A.x + A.w, y: ca.y}, p2: {x: B.x, y: cb.y}, d1: 'r', d2: 'l'} : {p1: {x: A.x, y: ca.y}, p2: {x: B.x + B.w, y: cb.y}, d1: 'l', d2: 'r'};
  return dy > 0 ? {p1: {x: ca.x, y: A.y + A.h}, p2: {x: cb.x, y: B.y}, d1: 'b', d2: 't'} : {p1: {x: ca.x, y: A.y}, p2: {x: cb.x, y: B.y + B.h}, d1: 't', d2: 'b'};
}
function updateEdges() {
  edgesLayer.innerHTML = ''; const a = hoverId || activeId, NS = 'http://www.w3.org/2000/svg';
  R.forEach(([from, to, label, dashed]) => {
    const ef = $('table-' + from), et = $('table-' + to); if (!ef || !et) return;
    const A = {x: byId[from].x, y: byId[from].y, w: ef.offsetWidth, h: ef.offsetHeight}, B = {x: byId[to].x, y: byId[to].y, w: et.offsetWidth, h: et.offsetHeight};
    const {p1, p2, d1, d2} = anchors(A, B), dist = Math.hypot(p2.x - p1.x, p2.y - p1.y) * .45;
    const c1 = {...p1}, c2 = {...p2};
    ({r: () => c1.x += dist, l: () => c1.x -= dist, b: () => c1.y += dist, t: () => c1.y -= dist})[d1]();
    ({r: () => c2.x += dist, l: () => c2.x -= dist, b: () => c2.y += dist, t: () => c2.y -= dist})[d2]();
    const hl = a && (from === a || to === a), g = document.createElementNS(NS, 'g');
    g.setAttribute('opacity', a && !hl ? '.15' : '.9');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${p1.x} ${p1.y}C${c1.x} ${c1.y},${c2.x} ${c2.y},${p2.x} ${p2.y}`);
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', hl ? '#38bdf8' : '#64748b'); p.setAttribute('stroke-width', hl ? 2.5 : 1.5);
    if (dashed) p.setAttribute('stroke-dasharray', '5,5');
    p.setAttribute('marker-end', `url(#a${hl ? 1 : 0})`); p.setAttribute('marker-start', `url(#d${hl ? 1 : 0})`);
    g.appendChild(p);
    if (hl) { // etiquetas solo en relaciones resaltadas para no saturar
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', .125 * p1.x + .375 * c1.x + .375 * c2.x + .125 * p2.x); tx.setAttribute('y', .125 * p1.y + .375 * c1.y + .375 * c2.y + .125 * p2.y - 6);
      tx.setAttribute('fill', '#38bdf8'); tx.setAttribute('font-size', '11'); tx.setAttribute('font-family', 'JetBrains Mono,monospace'); tx.setAttribute('text-anchor', 'middle');
      tx.textContent = label; g.appendChild(tx);
    }
    edgesLayer.appendChild(g);
  });
}

function updateTransform() { world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`; $('zoom-level').textContent = Math.round(scale * 100) + '%'; }
function zoomBy(f, cx, cy) {
  const old = scale; scale = Math.min(1.6, Math.max(.3, scale * f));
  const r = viewport.getBoundingClientRect(); cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  panX = cx - (cx - panX) * scale / old; panY = cy - (cy - panY) * scale / old; updateTransform();
}
viewport.addEventListener('wheel', e => { e.preventDefault(); const r = viewport.getBoundingClientRect(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }, {passive: false});

function resetLayout() {
  scale = .35; panX = 20; panY = 10;
  tables.forEach(t => { t.x = defaultPositions[t.id].x; t.y = defaultPositions[t.id].y; });
  renderTables(); closeSidebar(); updateTransform();
}

renderTables(); refresh(); updateTransform();
</script>
