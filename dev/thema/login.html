<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuMarca — Acceder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Anti-FOUC (idéntico al sistema) -->
<script>
(function(){
  function relLum(h,s,l){
    s/=100;l/=100;
    const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
    const f=n=>{let x=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.max(0,Math.min(1,x))};
    const lin=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
    return 0.2126*lin(f(0))+0.7152*lin(f(8))+0.0722*lin(f(4));
  }
  function inkSafeL(h,s){
    let lo=12,hi=64;
    while(hi-lo>0.5){const mid=(lo+hi)/2;if(relLum(h,s,mid)<=0.17)lo=mid;else hi=mid}
    return Math.round(lo);
  }
  let p={};
  try{p=JSON.parse(localStorage.getItem('ui-prefs-v2')||'{}')}catch(e){}
  const sysLight=matchMedia('(prefers-color-scheme: light)').matches;
  const h=p.h||160, s=p.s||84, L=inkSafeL(h,s);
  document.documentElement.dataset.theme=p.theme||(sysLight?'light':'dark');
  document.documentElement.style.setProperty('--h',h);
  document.documentElement.style.setProperty('--s',s+'%');
  document.documentElement.style.setProperty('--acc-strong',`hsl(${h} ${s}% ${L}%)`);
  document.documentElement.style.setProperty('--glow',`hsl(${h} ${s}% ${L}% / .38)`);
})();
</script>

<!-- Mismo diseño que el sistema -->
<link rel="stylesheet" href="css/01-theme.css">
<link rel="stylesheet" href="css/03-components.css">

<style>
/* ═══ Solo lo propio del login ═══ */
.auth-scene{min-height:100vh;min-height:100svh;display:flex;padding:1.75rem 1.25rem 2.125rem}
.auth-stack{margin:auto;width:100%;max-width:25rem;position:relative;z-index:1}
.top-actions{position:fixed;top:1.125rem;right:1.125rem;z-index:50}

.auth-card{border-radius:1.375rem;padding:2rem 1.875rem 1.75rem;animation:fadeInUp .5s ease both}
.auth-card.done{animation:none}
.auth-card.shake{animation:shakeLogin .5s}
@keyframes shakeLogin{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

/* Marca (estilos de layout no cargados aquí) */
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-bottom:1.5rem}
.brand-mark{width:3.25rem;height:3.25rem;border-radius:1rem;display:grid;place-items:center;color:#fff;
  background:var(--acc-strong);box-shadow:0 0 16px var(--glow),inset 0 1px 0 hsl(0 0% 100% / .25)}
.brand-mark svg{width:1.5rem;height:1.5rem}
.auth-brand-txt{text-align:center}
.auth-brand-txt b{font-size:1.1875rem;letter-spacing:-.02em;display:block}
.auth-brand-txt small{display:block;font-size:.625rem;font-weight:500;color:var(--text-2);letter-spacing:.12em;margin-top:.125rem}

/* Inputs con icono */
.input-ic{position:relative}
.input-ic>svg{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;
  color:var(--text-2);pointer-events:none}
.input-ic .input{padding-left:2.625rem}
.input-ic .input.has-eye{padding-right:2.875rem}
.eye{position:absolute;right:.4375rem;top:50%;transform:translateY(-50%);width:1.9375rem;height:1.9375rem;
  border-radius:.5rem;border:none;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center;transition:.15s}
.eye:hover{color:var(--text);background:var(--hover)}
.eye svg{width:1rem;height:1rem}
input.input:-webkit-autofill{
  -webkit-text-fill-color:var(--text);
  -webkit-box-shadow:0 0 0 40px var(--panel) inset;
  caret-color:var(--text);transition:background-color 99999s ease-in-out 0s}

/* Botón */
.btn-block{width:100%;justify-content:center;margin-top:.25rem}
.btn:disabled{opacity:.8;cursor:default;transform:none;filter:none}
.spinner{width:.9375rem;height:.9375rem;border-radius:50%;border:2px solid hsl(0 0% 100% / .35);
  border-top-color:#fff;animation:rot .7s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .auth-scene{padding:4.375rem 1rem 1.625rem}
  .auth-card{padding:1.625rem 1.25rem 1.375rem;border-radius:1.125rem}
  .top-actions{top:.875rem;right:.875rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="top-actions">
  <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema">
    <svg id="icoSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<div class="auth-scene">
  <main class="auth-stack">
    <div class="auth-card glass">

      <div class="auth-brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6c0 5-3 8-6 8s-6-3-6-8 3-4 6-4 6-1 6 4z"/><path d="M12 14v7"/></svg></div>
        <div class="auth-brand-txt"><b>TuMarca</b><small>PUNTO DE VENTA</small></div>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            <input class="input" type="email" id="email" name="email" placeholder="tucorreo@empresa.com"
                   autocomplete="email" spellcheck="false" inputmode="email">
          </div>
          <div class="err-msg" id="emailErr">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            Ingresa un correo válido.
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input has-eye" type="password" id="password" name="password" placeholder="••••••••"
                   autocomplete="current-password">
            <button type="button" class="eye" id="btnEye" aria-label="Mostrar u ocultar contraseña">
              <svg id="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOff" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
          <div class="err-msg" id="passErr">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            La contraseña debe tener al menos 6 caracteres.
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          <span id="btnLabel">Iniciar sesión</span>
          <svg id="btnArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          <span class="spinner" id="btnSpin" style="display:none"></span>
        </button>
      </form>

    </div>
  </main>
</div>

<script>
/* ═══ Tema — mismas prefs que el sistema ═══ */
const root=document.documentElement,PREFS_KEY='ui-prefs-v2';
function persist(){try{
  const h=parseFloat(getComputedStyle(root).getPropertyValue('--h'))||160,
        s=parseFloat(getComputedStyle(root).getPropertyValue('--s'))||84;
  localStorage.setItem(PREFS_KEY,JSON.stringify({theme:root.dataset.theme,h,s}))
}catch(e){}}
const icoSun=document.getElementById('icoSun'),icoMoon=document.getElementById('icoMoon');
function syncThemeIcons(){const l=root.dataset.theme==='light';
  icoSun.style.display=l?'block':'none';icoMoon.style.display=l?'none':'block'}
syncThemeIcons();
document.getElementById('btnTheme').onclick=()=>{
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  syncThemeIcons();persist();
};
matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{
  let sv={};try{sv=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')}catch(err){}
  if(!sv.theme){root.dataset.theme=e.matches?'light':'dark';syncThemeIcons()}
});

/* ═══ Ojo: mostrar / ocultar contraseña ═══ */
const pwd=document.getElementById('password'),
      btnEye=document.getElementById('btnEye'),
      eyeOn=document.getElementById('eyeOn'),
      eyeOff=document.getElementById('eyeOff');
btnEye.onclick=()=>{
  const show=pwd.type==='password';
  pwd.type=show?'text':'password';
  eyeOn.style.display=show?'none':'block';
  eyeOff.style.display=show?'block':'none';
  pwd.focus();
};

/* ═══ Acceder ═══ */
const form=document.getElementById('loginForm'),
      email=document.getElementById('email'),
      emailErr=document.getElementById('emailErr'),
      passErr=document.getElementById('passErr'),
      authCard=document.querySelector('.auth-card'),
      btn=document.getElementById('btnLogin'),
      btnLabel=document.getElementById('btnLabel'),
      btnArrow=document.getElementById('btnArrow'),
      btnSpin=document.getElementById('btnSpin');

email.addEventListener('input',()=>{email.classList.remove('error');emailErr.classList.remove('show')});
pwd.addEventListener('input',()=>{pwd.classList.remove('error');passErr.classList.remove('show')});

function shakeCard(){
  authCard.classList.add('done');
  authCard.classList.remove('shakeLogin');
  void authCard.offsetWidth;
  authCard.classList.add('shakeLogin');
}
authCard.addEventListener('animationend',e=>{
  if(e.animationName==='shakeLogin')authCard.classList.remove('shakeLogin')});

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let busy=false;

form.addEventListener('submit',e=>{
  e.preventDefault();
  if(busy)return;

  const okE=EMAIL_RE.test(email.value.trim()),
        okP=pwd.value.length>=6;
  email.classList.toggle('error',!okE);emailErr.classList.toggle('show',!okE);
  pwd.classList.toggle('error',!okP);passErr.classList.toggle('show',!okP);

  if(!okE||!okP){shakeCard();(!okE?email:pwd).focus();return}

  busy=true;btn.disabled=true;
  btnLabel.textContent='Accediendo…';
  btnArrow.style.display='none';btnSpin.style.display='inline-block';

  /* Aquí llama a tu API real; en el prototipo entra directo */
  setTimeout(()=>{window.location.href='index.html'},600);
});

if(email.value)pwd.focus();else email.focus();
</script>
</body>
</html>
