<!-- ===== BLOQUE JS 2: FUNCIONAMIENTO DE LA APLICACIÓN (se queda) ===== -->
<script id="app-js">
/* =====================================================================
   FUNCIONAMIENTO DE LA APLICACIÓN
   Interfaz, estado, filtros, flujo de carga y revisión. No contiene datos:
   los lee de window.DEMO (o del back cuando se conecte).
   ===================================================================== */

/* --- Colores del tema: las clases CSS los leen como variables --- */
const PALETTE = { bg: 'var(--bg)', side: 'var(--side)', surface: 'var(--surface)', surface2: 'var(--surface2)', border: 'var(--border)', text: 'var(--text)', muted: 'var(--muted)', accent: 'var(--accent)', onAccent: 'var(--on-accent)', accentSoft: 'var(--accent-soft)', accentText: 'var(--accent-text)' };

/* --- Motor mínimo de plantillas (data-if, data-for, {{ expresiones }}, data-on-*) --- */
const _fn = {};
function ev(expr, scope) { return (_fn[expr] || (_fn[expr] = new Function('__s', 'with(__s){return (' + expr + ')}')))(scope); }
function one(v) { const m = /^\{\{\s*([\s\S]*?)\s*\}\}$/.exec(v); return m ? m[1] : null; }
function interp(str, scope) { return str.replace(/\{\{\s*([\s\S]*?)\s*\}\}/g, (_, e) => { const v = ev(e, scope); return v == null ? '' : String(v); }); }
function kids(from, scope, to) { from.childNodes.forEach((c) => { const n = build(c, scope); if (n) to.appendChild(n); }); }
function build(node, scope) {
  if (node.nodeType === 3) return document.createTextNode(node.nodeValue.includes('{{') ? interp(node.nodeValue, scope) : node.nodeValue);
  if (node.nodeType !== 1) return null;
  if (node.tagName === 'TEMPLATE') {
    const frag = document.createDocumentFragment();
    if (node.hasAttribute('data-if')) { if (ev(node.getAttribute('data-if'), scope)) kids(node.content, scope, frag); }
    else if (node.hasAttribute('data-for')) {
      (ev(node.getAttribute('data-for'), scope) || []).forEach((it) => { const sc = Object.create(scope); sc[node.getAttribute('data-as')] = it; kids(node.content, sc, frag); });
    }
    return frag;
  }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  Array.from(node.attributes).forEach((a) => {
    const n = a.name, v = a.value;
    if (n.startsWith('data-on-')) { const fn = ev(one(v), scope); if (typeof fn === 'function') el.addEventListener(n.slice(8) === 'change' ? 'input' : n.slice(8), fn); return; }
    if (n === 'data-style') { el.style.cssText = interp(v, scope); return; }
    const ex = one(v);
    if (ex !== null) {
      const val = ev(ex, scope);
      if (n === 'value') { el.value = val == null ? '' : val; return; }
      if (n === 'checked') { el.checked = !!val; return; }
      if (n.startsWith('aria-')) { el.setAttribute(n, String(val)); return; }
      if (val === false || val == null) return;
      el.setAttribute(n, String(val)); return;
    }
    el.setAttribute(n, v.includes('{{') ? interp(v, scope) : v);
  });
  kids(node, scope, el);
  return el;
}

/* --- Base de componente: estado + re-render --- */
class DCLogic {
  constructor() { this.props = {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, patch); this.render(); }
  render() {
    const root = document.getElementById('app'), a = document.activeElement;
    const keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
    const scope = Object.assign(Object.create(null), this.renderVals());
    const frag = document.createDocumentFragment();
    kids(document.getElementById('plantilla').content, scope, frag);
    root.replaceChildren(frag);
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (x) {} } }
  }
}

/* --- Lógica de la aplicación --- */
class Component extends DCLogic {
  hexToHsl(hex) {
    let h = (hex || '#14B8A6').replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let hue = 0;
    if (d) {
      if (mx === r) hue = ((g - b) / d) % 6;
      else if (mx === g) hue = (b - r) / d + 2;
      else hue = (r - g) / d + 4;
      hue *= 60;
      if (hue < 0) hue += 360;
    }
    const l = (mx + mn) / 2;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    return [Math.round(hue), Math.round(s * 100)];
  }
  searchVals(p, st, base, view, dark) {
    const f = Object.assign({ q: '', scope: [], types: [], exts: [], status: 'all', from: '', to: '', by: [], sort: 'recent' }, st.f || {});
    const set = (patch) => this.setState({ f: Object.assign({}, f, patch) });
    const tg = (key, v) => () => set({ [key]: f[key].includes(v) ? f[key].filter((x) => x !== v) : f[key].concat(v) });
    const opt = (label, on, pick) => ({ label: label, on: on, pick: pick, bg: on ? p.accentSoft : p.surface, fg: on ? p.accentText : p.text, bd: on ? p.accent : p.border });
    const uniq = (k) => Array.from(new Set(base.map((r) => r[k])));
    const q = f.q.trim().toLowerCase();
    const sc = f.scope.length ? f.scope : ['nombre', 'contenido', 'etiquetas'];
    const clean = (t) => t.replace(/[#*|>-]/g, ' ').replace(/\s+/g, ' ').trim();
    const res = base.map((r, i) => Object.assign({}, r, { i: i })).filter((r) => {
      if (q) {
        const hay = (sc.includes('nombre') ? r.name : '') + ' ' + (sc.includes('contenido') ? r.preview : '') + ' ' + (sc.includes('etiquetas') ? r.tags.join(' ') : '');
        if (!hay.toLowerCase().includes(q)) return false;
      }
      if (f.types.length && !f.types.includes(r.type)) return false;
      if (f.exts.length && !f.exts.includes(r.ext)) return false;
      if (r.s === 'descartado') return false;
      if (f.status !== 'all' && r.s !== f.status) return false;
      if (f.from && r.iso < f.from) return false;
      if (f.to && r.iso > f.to) return false;
      if (f.by.length && !f.by.includes(r.by)) return false;
      return true;
    });
    res.sort(f.sort === 'name' ? (a, b) => a.name.localeCompare(b.name) : (a, b) => b.iso.localeCompare(a.iso));
    const results = res.map((r) => {
      const ls = r.preview.split('\n').map(clean).filter(Boolean);
      const hit = q && sc.includes('contenido') ? ls.find((l) => l.toLowerCase().includes(q)) : null;
      return { name: r.name, ext: r.ext, meta: r.type + ' · ' + r.date + ' · ' + r.by, snippet: hit || ls[1] || ls[0] || '', tags: r.tags, status: (r.s === 'archivado' ? '✓ ' : r.s === 'clasificar' ? '! ' : '◌ ') + r.sl, open: () => this.setState({ view: 'library', dem: 'data', sel: r.i, sheet: true }) };
    });
    const groups = [
      { title: 'Buscar en (vacío = todo)', opts: [['nombre', 'Nombre'], ['contenido', 'Contenido'], ['etiquetas', 'Etiquetas']].map((x) => opt(x[1], f.scope.includes(x[0]), tg('scope', x[0]))) },
